<!doctype html>
<html lang="ko">
<head>

<body>

<script>

    let html=await res.text();

    const newJamoPaths=`const jamoPaths={

    html=html.replace(/const jamoPaths=\{[\s\S]*?\n\};/,newJamoPaths);

    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<div class="loading">앱을 불러오지 못했어요. 페이지를 새로고침해 주세요.</div>';

</script>
</body>
</html>
