<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>혜온이 한글 따라쓰기</title>
<link rel="manifest" href="./manifest.webmanifest">
<meta name="theme-color" content="#fffaf3">
<style>
@font-face{font-family:NBG;src:url('./fonts/NanumBarunGothic.otf') format('opentype');font-weight:400;font-display:swap}
@font-face{font-family:NBG;src:url('./fonts/NanumBarunGothicBold.otf') format('opentype');font-weight:700 900;font-display:swap}
:root{--bg:#fffaf3;--card:#fff;--text:#2d2d2d;--muted:#827a72;--accent:#ff805d;--yellow:#ffd166;--good:#51b58d}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;font-family:NBG,'Noto Sans KR',sans-serif;background:var(--bg);color:var(--text)}
body{display:flex;justify-content:center}.app{width:min(100%,760px);padding:14px 14px 28px}.top{display:flex;align-items:center;justify-content:space-between;gap:10px}h1{font-size:clamp(22px,6vw,34px);margin:6px 0 10px}.stars{font-size:20px;background:#fff;border:2px solid #eee3d7;border-radius:20px;padding:7px 11px;white-space:nowrap}
.tabs{display:flex;gap:8px;margin:8px 0 10px}.tab{flex:1;border:0;border-radius:16px;padding:12px 8px;font:800 18px NBG;background:#eee}.tab.active{background:var(--yellow)}
.letters{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}.letters::-webkit-scrollbar{display:none}.letterBtn{min-width:58px;height:58px;border:none;border-radius:17px;background:#fff;box-shadow:0 2px 0 #e7dccd;font:800 30px NBG;color:#111}.letterBtn.active{outline:4px solid var(--yellow);background:#fff8df}
.card{background:#fff;border-radius:28px;padding:12px;box-shadow:0 6px 22px rgba(90,60,20,.08)}.prompt{text-align:center;margin:4px 0 8px}.big{font:800 clamp(72px,20vw,116px)/1 NBG;height:118px;display:flex;align-items:center;justify-content:center}.sub{font:700 18px NBG;color:#666;margin-top:3px}
.canvasWrap{position:relative;aspect-ratio:1/1;width:100%;max-height:56vh;border:4px solid #eee2d5;border-radius:24px;overflow:hidden;background:#fffdf9}#guide,#draw{position:absolute;inset:0;width:100%;height:100%;touch-action:none}#guide{pointer-events:none}.status{text-align:center;min-height:30px;padding-top:8px;font:800 17px NBG;color:#746b62}.status.good{color:#278662}.status.bad{color:#d96b50}
.controls{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin-top:8px}.action{border:0;border-radius:18px;padding:14px 8px;font:800 17px NBG;background:#f3eee7}.primary{background:var(--accent);color:#fff}.ok{background:var(--good);color:#fff}.tip{text-align:center;color:var(--muted);font-size:14px;margin:10px 4px 2px;line-height:1.5}.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden}.piece{position:absolute;top:-20px;font-size:24px;animation:fall 1.3s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:.2}}@media(max-width:430px){.controls{grid-template-columns:1fr 1fr}.controls .wide{grid-column:1/-1}}
</style>
</head>
<body>
<div class="app"><div class="top"><h1>🌱 혜온이 한글 따라쓰기</h1><div class="stars">⭐ <span id="starCount">0</span></div></div>
<div class="tabs"><button class="tab active" data-mode="consonant">자음</button><button class="tab" data-mode="vowel">모음</button><button class="tab" data-mode="syllable">글자</button></div>
<div class="letters" id="letters"></div>
<div class="card"><div class="prompt"><div class="big" id="bigLetter">ㄱ</div><div class="sub" id="soundText">기역</div></div>
<div class="canvasWrap"><canvas id="guide"></canvas><canvas id="draw"></canvas></div>
<div class="status" id="status">① 1획부터 번호와 화살표를 보고 써요 👆</div>
<div class="controls"><button class="action" id="listenBtn">🔊 소리</button><button class="action" id="clearBtn">🧽 다시</button><button class="action ok" id="doneBtn">⭐ 다 썼어요</button><button class="action primary wide" id="nextBtn">다음 글자 →</button></div>
<div class="tip">위 예시 글자는 나눔바른고딕 그대로 보여주고, 아래 점선만 따라쓰기용 획순으로 안내해요.</div></div></div><div class="confetti" id="confetti"></div>
<script>
const sets={consonant:[["ㄱ","기역"],["ㄴ","니은"],["ㄷ","디귿"],["ㄹ","리을"],["ㅁ","미음"],["ㅂ","비읍"],["ㅅ","시옷"],["ㅇ","이응"],["ㅈ","지읒"],["ㅊ","치읓"],["ㅋ","키읔"],["ㅌ","티읕"],["ㅍ","피읖"],["ㅎ","히읗"]],vowel:[["ㅏ","아"],["ㅑ","야"],["ㅓ","어"],["ㅕ","여"],["ㅗ","오"],["ㅛ","요"],["ㅜ","우"],["ㅠ","유"],["ㅡ","으"],["ㅣ","이"]],syllable:[["가","가"],["나","나"],["다","다"],["라","라"],["마","마"],["바","바"],["사","사"],["아","아"],["자","자"],["차","차"],["카","카"],["타","타"],["파","파"],["하","하"]]};
const P={
"ㄱ":[[[24,24],[76,24]],[[76,24],[76,78]]],"ㄴ":[[[26,22],[26,78]],[[26,78],[76,78]]],"ㄷ":[[[24,24],[76,24]],[[24,24],[24,78],[76,78]],[[76,24],[76,78]]],
"ㄹ":[[[24,22],[76,22],[76,42],[40,42]],[[40,42],[40,60],[76,60],[76,78]],[[76,78],[24,78]]],
"ㅁ":[[[24,24],[76,24]],[[24,24],[24,78],[76,78]],[[76,24],[76,78]]],"ㅂ":[[[28,22],[28,78]],[[72,22],[72,78]],[[28,22],[72,22]],[[28,78],[72,78]]],
"ㅅ":[[[50,22],[28,78]],[[50,22],[72,78]]],"ㅇ":[[[50,22],[66,27],[76,41],[76,59],[66,73],[50,78],[34,73],[24,59],[24,41],[34,27],[50,22]]],"ㅈ":[[[28,26],[72,26]],[[50,26],[28,78]],[[50,26],[72,78]]],"ㅊ":[[[38,18],[62,18]],[[28,34],[72,34]],[[50,34],[28,80]],[[50,34],[72,80]]],
"ㅋ":[[[28,22],[28,78]],[[28,34],[72,34]],[[28,56],[72,56]]],"ㅌ":[[[24,22],[76,22]],[[24,22],[24,78],[76,78]],[[24,50],[76,50]],[[76,22],[76,78]]],"ㅍ":[[[24,24],[76,24]],[[38,24],[38,78]],[[62,24],[62,78]],[[24,78],[76,78]]],"ㅎ":[[[38,18],[62,18]],[[28,34],[72,34]],[[50,47],[64,51],[72,62],[68,74],[58,80],[42,80],[32,74],[28,62],[36,51],[50,47]]],
"ㅏ":[[[42,20],[42,80]],[[42,50],[72,50]]],"ㅑ":[[[42,20],[42,80]],[[42,40],[72,40]],[[42,60],[72,60]]],"ㅓ":[[[58,20],[58,80]],[[28,50],[58,50]]],"ㅕ":[[[58,20],[58,80]],[[28,40],[58,40]],[[28,60],[58,60]]],"ㅗ":[[[24,62],[76,62]],[[50,24],[50,62]]],"ㅛ":[[[24,65],[76,65]],[[40,28],[40,65]],[[60,28],[60,65]]],"ㅜ":[[[24,38],[76,38]],[[50,38],[50,76]]],"ㅠ":[[[24,35],[76,35]],[[40,35],[40,72]],[[60,35],[60,72]]],"ㅡ":[[[22,50],[78,50]]],"ㅣ":[[[50,20],[50,80]]]
};
const lead={가:"ㄱ",나:"ㄴ",다:"ㄷ",라:"ㄹ",마:"ㅁ",바:"ㅂ",사:"ㅅ",아:"ㅇ",자:"ㅈ",차:"ㅊ",카:"ㅋ",타:"ㅌ",파:"ㅍ",하:"ㅎ"};
let mode="consonant",idx=0,stars=0,currentStroke=0,drawing=false,last=null,completed=false,samples=[],visited=new Set();
const letters=document.getElementById('letters'),big=document.getElementById('bigLetter'),sound=document.getElementById('soundText'),status=document.getElementById('status'),guide=document.getElementById('guide'),draw=document.getElementById('draw'),g=guide.getContext('2d'),d=draw.getContext('2d');
const cur=()=>sets[mode][idx]; const px=(p,r)=>({x:p[0]*r.width/100,y:p[1]*r.height/100});
function t(st,sx,sy,tx,ty){return st.map(([x,y])=>[x*sx+tx,y*sy+ty])}function paths(){if(mode!=='syllable')return P[cur()[0]];const a=P[lead[cur()[0]]].map(s=>t(s,.58,.9,2,5)),v=P['ㅏ'].map(s=>t(s,.50,.9,45,5));return [...a,...v]}
function resize(){const r=draw.getBoundingClientRect(),q=devicePixelRatio||1;[guide,draw].forEach(c=>{c.width=r.width*q;c.height=r.height*q;c.getContext('2d').setTransform(q,0,0,q,0,0)});reset()}
function render(){letters.innerHTML='';sets[mode].forEach((it,i)=>{const b=document.createElement('button');b.className='letterBtn'+(i===idx?' active':'');b.textContent=it[0];b.onclick=()=>{idx=i;update();reset()};letters.appendChild(b)});big.textContent=cur()[0];sound.textContent=cur()[1]}
function guidePaint(){const r=guide.getBoundingClientRect();g.clearRect(0,0,r.width,r.height);paths().forEach((st,si)=>{const active=si===currentStroke&&!completed;g.strokeStyle=active?'#aaa198':'#e4ddd5';g.lineWidth=Math.max(13,r.width*.036);g.lineCap='round';g.lineJoin='round';g.setLineDash([3,19]);g.beginPath();st.forEach((p,i)=>{const q=px(p,r);i?g.lineTo(q.x,q.y):g.moveTo(q.x,q.y)});g.stroke();g.setLineDash([]);const s=px(st[0],r);g.fillStyle=active?'#ffd54f':'#eee8e2';g.beginPath();g.arc(s.x,s.y,active?11:7,0,Math.PI*2);g.fill();const bx=s.x+(s.x<r.width/2?30:-30),by=s.y+(s.y<r.height/2?30:-30);g.fillStyle=active?'#ff805d':'#d8d0c8';g.beginPath();g.arc(bx,by,active?18:14,0,Math.PI*2);g.fill();g.fillStyle='#fff';g.font='800 '+Math.max(17,r.width*.05)+'px NBG';g.textAlign='center';g.textBaseline='middle';g.fillText(si+1,bx,by+1);if(active&&st.length>1)arrow(px(st[0],r),px(st[1],r),r)});}
function arrow(a,b,r){const vx=b.x-a.x,vy=b.y-a.y,l=Math.hypot(vx,vy)||1,u={x:vx/l,y:vy/l},L=Math.min(58,Math.max(34,l*.45)),x=a.x+u.x*L,y=a.y+u.y*L,z=Math.max(13,r.width*.035),ang=Math.atan2(u.y,u.x);g.strokeStyle=g.fillStyle='#ff6f47';g.lineWidth=Math.max(6,r.width*.014);g.beginPath();g.moveTo(a.x,a.y);g.lineTo(x,y);g.stroke();g.beginPath();g.moveTo(x,y);g.lineTo(x-z*Math.cos(ang-Math.PI/6),y-z*Math.sin(ang-Math.PI/6));g.lineTo(x-z*Math.cos(ang+Math.PI/6),y-z*Math.sin(ang+Math.PI/6));g.closePath();g.fill()}
function build(){samples=[];visited=new Set();const r=draw.getBoundingClientRect(),st=paths()[currentStroke];let id=0;for(let i=0;i<st.length-1;i++){const a=px(st[i],r),b=px(st[i+1],r),n=Math.max(3,Math.ceil(Math.hypot(b.x-a.x,b.y-a.y)/18));for(let j=0;j<=n;j++){const q=j/n;samples.push({id:id++,x:a.x+(b.x-a.x)*q,y:a.y+(b.y-a.y)*q})}}}
function reset(){d.clearRect(0,0,draw.getBoundingClientRect().width,draw.getBoundingClientRect().height);currentStroke=0;drawing=false;last=null;completed=false;build();guidePaint();setStatus('① 1획부터 번호와 화살표를 보고 써요 👆','')}
function nearSeg(p,a,b){const vx=b.x-a.x,vy=b.y-a.y,w={x:p.x-a.x,y:p.y-a.y},l=vx*vx+vy*vy;let t=l?(w.x*vx+w.y*vy)/l:0;t=Math.max(0,Math.min(1,t));const q={x:a.x+t*vx,y:a.y+t*vy};return{q,dist:Math.hypot(p.x-q.x,p.y-q.y)}}
function nearest(p){const r=draw.getBoundingClientRect(),st=paths()[currentStroke];let best={dist:1e9,q:null};for(let i=0;i<st.length-1;i++){const n=nearSeg(p,px(st[i],r),px(st[i+1],r));if(n.dist<best.dist)best=n}return best}const th=()=>Math.max(24,draw.getBoundingClientRect().width*.07);function mark(q){for(const s of samples)if(Math.hypot(q.x-s.x,q.y-s.y)<=th())visited.add(s.id)}const ratio=()=>samples.length?visited.size/samples.length:0;function pos(e){const r=draw.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top}}
function start(e){if(completed)return;drawing=true;const n=nearest(pos(e));if(n.dist<=th()){last=n.q;mark(n.q);setStatus((currentStroke+1)+'획 좋아요! 😊','good')}else{last=null;setStatus('노란 점 근처에서 시작해요 🙂','bad')}e.preventDefault()}
function move(e){if(!drawing||completed)return;const n=nearest(pos(e));if(n.dist<=th()){if(last){d.strokeStyle='#ff805d';d.lineWidth=Math.max(12,draw.getBoundingClientRect().width*.035);d.lineCap='round';d.lineJoin='round';d.beginPath();d.moveTo(last.x,last.y);d.lineTo(n.q.x,n.q.y);d.stroke()}last=n.q;mark(n.q);setStatus((currentStroke+1)+'획 '+Math.round(ratio()*100)+'% 👏','good');if(ratio()>=1)finishStroke()}else{last=null;setStatus('점선에서 벗어났어요 👆','bad')}e.preventDefault()}function end(){drawing=false;last=null}
function finishStroke(){if(currentStroke<paths().length-1){currentStroke++;build();guidePaint();setStatus(currentStroke+'획 완료! 이제 '+(currentStroke+1)+'획이에요 ⭐','good')}else finishLetter()}
function ding(){try{const A=AudioContext||webkitAudioContext,a=new A(),o=a.createOscillator(),gain=a.createGain();o.connect(gain);gain.connect(a.destination);o.frequency.value=1100;gain.gain.setValueAtTime(.25,a.currentTime);gain.gain.exponentialRampToValueAtTime(.001,a.currentTime+.3);o.start();o.stop(a.currentTime+.3)}catch(e){}}
function speak(){if(!speechSynthesis)return;setTimeout(()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur()[1]);u.lang='ko-KR';u.rate=.72;u.onend=()=>{const c=new SpeechSynthesisUtterance('혜온이 엄청 멋저요!');c.lang='ko-KR';c.rate=.82;speechSynthesis.speak(c)};speechSynthesis.speak(u)},380)}
function finishLetter(){completed=true;stars++;document.getElementById('starCount').textContent=stars;guidePaint();setStatus('완성! '+cur()[0]+' ⭐','good');ding();speak()}
function setStatus(m,c){status.textContent=m;status.className='status'+(c?' '+c:'')}function update(){render();guidePaint();requestAnimationFrame(()=>letters.querySelector('.active')?.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'}))}
draw.addEventListener('pointerdown',start);draw.addEventListener('pointermove',move);draw.addEventListener('pointerup',end);draw.addEventListener('pointercancel',end);document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;idx=0;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===b));update();reset()});document.getElementById('clearBtn').onclick=reset;document.getElementById('nextBtn').onclick=()=>{idx=(idx+1)%sets[mode].length;update();reset()};document.getElementById('listenBtn').onclick=()=>{if(!speechSynthesis)return;const u=new SpeechSynthesisUtterance(cur()[1]);u.lang='ko-KR';u.rate=.72;speechSynthesis.cancel();speechSynthesis.speak(u)};document.getElementById('doneBtn').onclick=()=>completed?(ding(),speak()):setStatus((currentStroke+1)+'획을 100% 따라 써야 해요 😊','bad');window.addEventListener('resize',resize);render();setTimeout(resize,80);
if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js?v=19').catch(()=>{});
</script><script src="./font-trace.js?v=19"></script></body></html>
