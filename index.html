<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>혜온이 한글 따라쓰기</title>
<link rel="manifest" href="./pwa.webmanifest">
<meta name="theme-color" content="#fffaf3">
<style>html,body{margin:0;background:#fffaf3;font-family:sans-serif}.loading{display:flex;min-height:70vh;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#555}</style>
</head>
<body>
<div class="loading">🌱 혜온이 한글 앱을 여는 중…</div>
<script>
(async()=>{
try{
 const res=await fetch('./manifest.webmanifest?v=12',{cache:'no-store'});
 if(!res.ok) throw new Error('source');
 let html=await res.text();

 const newJamoPaths=`const jamoPaths={
"ㄱ":[[[24,24],[76,24]],[[76,24],[76,78]]],
"ㄴ":[[[26,22],[26,78]],[[26,78],[76,78]]],
"ㄷ":[[[24,24],[76,24]],[[24,24],[24,78]],[[24,78],[76,78]],[[76,24],[76,78]]],
"ㄹ":[[[24,22],[76,22]],[[76,22],[76,42]],[[76,42],[40,42]],[[40,42],[40,60]],[[40,60],[76,60]],[[76,60],[76,78]],[[24,78],[76,78]]],
"ㅁ":[[[24,24],[76,24]],[[24,24],[24,78]],[[24,78],[76,78]],[[76,24],[76,78]]],
"ㅂ":[[[28,22],[28,78]],[[72,22],[72,78]],[[28,22],[72,22]],[[28,50],[72,50]],[[28,78],[72,78]]],
"ㅅ":[[[50,22],[28,78]],[[50,22],[72,78]]],
"ㅇ":[[[50,22],[65,27],[75,40],[76,58],[66,72],[50,78],[34,72],[24,58],[25,40],[35,27],[50,22]]],
"ㅈ":[[[28,26],[72,26]],[[50,26],[28,78]],[[50,26],[72,78]]],
"ㅊ":[[[38,18],[62,18]],[[28,34],[72,34]],[[50,34],[28,80]],[[50,34],[72,80]]],
"ㅋ":[[[28,22],[28,78]],[[28,30],[72,30]],[[28,52],[76,52]]],
"ㅌ":[[[24,22],[76,22]],[[24,22],[24,78]],[[24,50],[76,50]],[[76,22],[76,78]],[[24,78],[76,78]]],
"ㅍ":[[[24,24],[76,24]],[[38,24],[38,78]],[[62,24],[62,78]],[[24,78],[76,78]]],
"ㅎ":[[[38,18],[62,18]],[[28,34],[72,34]],[[50,47],[64,51],[72,62],[68,74],[58,80],[42,80],[32,74],[28,62],[36,51],[50,47]]],
"ㅏ":[[[42,20],[42,80]],[[42,50],[72,50]]],
"ㅑ":[[[42,20],[42,80]],[[42,40],[72,40]],[[42,60],[72,60]]],
"ㅓ":[[[58,20],[58,80]],[[28,50],[58,50]]],
"ㅕ":[[[58,20],[58,80]],[[28,40],[58,40]],[[28,60],[58,60]]],
"ㅗ":[[[24,62],[76,62]],[[50,24],[50,62]]],
"ㅛ":[[[24,65],[76,65]],[[40,28],[40,65]],[[60,28],[60,65]]],
"ㅜ":[[[24,38],[76,38]],[[50,38],[50,76]]],
"ㅠ":[[[24,35],[76,35]],[[40,35],[40,72]],[[60,35],[60,72]]],
"ㅡ":[[[22,50],[78,50]]],
"ㅣ":[[[50,20],[50,80]]]
};`;
 html=html.replace(/const jamoPaths=\{[\s\S]*?\n\};/,newJamoPaths);
 html=html.replace(/href=["']manifest\.webmanifest["']/g,'href="pwa.webmanifest"');
 html=html.replace(/href=["']icons\/icon-192\.png["']/g,'href="icons/icon.svg"');

 const patch=`<style>
 .letterBtn{display:flex!important;align-items:center;justify-content:center;padding:6px!important}
 .letterBtn svg{width:36px;height:36px;overflow:visible}
 .big{height:118px;display:flex;align-items:center;justify-content:center;font-size:0!important}
 .big svg{width:112px;height:112px;overflow:visible}
 </style>
 <script>
 (()=>{
  function pts(st){return st.map(p=>p[0]+','+p[1]).join(' ')}
  function glyph(paths,w){
    return '<svg viewBox="0 0 100 100" aria-hidden="true">'+
      paths.map(st=>'<polyline points="'+pts(st)+'" fill="none" stroke="#171717" stroke-width="'+(w||10)+'" stroke-linecap="butt" stroke-linejoin="miter"/>').join('')+
      '</svg>';
  }
  function pathsFor(ch){
    return mode==='syllable'?buildSyllablePaths(ch):(jamoPaths[ch]||[]);
  }
  renderLetters=function(){
    lettersEl.innerHTML='';
    sets[mode].forEach((it,i)=>{
      const b=document.createElement('button');
      b.type='button';
      b.className='letterBtn'+(i===idx?' active':'');
      b.innerHTML=glyph(pathsFor(it[0]),10);
      b.setAttribute('aria-label',it[1]);
      b.addEventListener('click',()=>{idx=i;update();resetLetter()});
      lettersEl.appendChild(b);
    });
  };
  update=function(){
    bigLetter.innerHTML=glyph(currentPaths(),10);
    soundText.textContent=current()[1];
    renderLetters();paintGuide();
    requestAnimationFrame(()=>{const a=lettersEl.querySelector('.active');if(a)a.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})});
  };
  renderLetters();update();resetLetter();
 })();
 <\/script>`;
 html=html.replace('</body>',patch+'</body>');
 document.open();document.write(html);document.close();
}catch(e){
 document.body.innerHTML='<div class="loading">앱을 불러오지 못했어요. 새로고침해 주세요.</div>';
}
})();
</script>
</body>
</html>
